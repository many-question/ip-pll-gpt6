overall:
  phase: 噪声精度与归因验证、核心PSS初始化修复
  summary: 噪声/抖动优先，功耗后端暂缓。2倍输出链精度门槛通过；4倍局部63.275fs仍在复核。发现并以单变量A/B修复核心电源探针初态遗漏，修正PSS正在运行，尚无有效闭环噪声。分频补低RF及角落回归继续。主DUT未变，无整机RMS达标结论。
  since_last:
  - 2倍输出链匹配六点精度完成：1ps/383对0.5ps/767/maxacfreq504GHz，最大PSD差0.01275dB，小于0.2dB判据。TT27/1.2V/984MHz/10fF、无噪声实测波形重放；不是六点RMS或完整PLL。六输出沿和五组fresh-PSS
    noise-on已接续运行。
  - 同物理核心的两个10ns A/B只补XP.vco_vdd/rx_vdd/rt_vdd三个1.2V初值，原0V初始化和209.364A数值尖峰消失；修正组整段绝对峰值22.001mA。电流保存改变保留节点集合，源tran终态遗漏这些节点。已确认初始化原因，但未证明它是所有PSS不收敛的唯一原因。
  - coretripnoise01首轮后主动停止以隔离初态问题，1.927GB稳定段回收并保存SHA；SPECTRE-18发生在SIGINT/SPECTRE-25之后，不写成自发崩溃或物理电路确定不收敛。
  - 修正后coretripsupply01只更换初态文件：fresh4MHz PSS、1µs稳定段、1ps/traponly，6线程。最初5ns进度观察未复现异常尖峰；PSS残差与六点噪声仍待结果。分析器新增各运行分支、绝对周期、寄存器及全部保存电压端点检查，未通过不积分RMS。
  - 4倍自己的六边沿和五组noise-on已准备；有限接续仅在自己的精度通过、释放原1线程后运行，不以2倍验证替代。
  - 17例补充接口回归目前完成3例、通过3例；使用预定400–600ns窗口。加入刺激绝对RF、逐周期RF、输出绝对频率判据；原六档SS高端仍通过。固定同一SS波形形状跨角比较，不是各角实际LC或完整PVT。
  - 完整PLL严格64µs捕获继续；仍未完成，不重启，不用无噪声边沿漂移冒充随机抖动。
