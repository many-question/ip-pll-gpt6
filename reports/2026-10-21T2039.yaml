overall:
  phase: RNL 功能符号与紧凑排布交付；仿真任务线保持暂停
  summary: 同一纯网表目录的 81 个子电路均改用带功能图示的符号；顶层与控制器人工重排，其余层次压缩空白间隔。元件、字号和电气语句保持；未使用 solver 或自动走线。
  since_last:
  - 逻辑门采用门形及反相圆圈；时序符号标示 D/Q 与时钟边沿，模拟及控制符号加入相应功能图示。
  - 相对126版本，顶层画布面积减少53.07%，控制器页56.73%，FLL门图49.42%；参考缓冲链宽度减少27.38%。这是图形画布范围，不是芯片面积。
  - 全部81子电路仍可达；2932实例、15140端子显式定位/走线，378条连续导线的端点与折线几何复核通过。
  - RNL runtime检查82非空层次，零错误/警告/提示/未定位；电气语句与冻结源逐条一致，展开21479 MOS。
  - 仿真研究与定时任务继续暂停，未远程访问、回收、重启或派发仿真。
  route_confidence: medium
  route_confidence_reason: RNL 交付提高设计可读性及可接续性，不提高物理证据成熟度；原全频、噪声、PVT、功耗和面积缺口保持。
