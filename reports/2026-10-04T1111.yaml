  trigger: proactive
  covers_since: '2026-10-04T10:20:28+08:00'
overall:
  phase: 实际噪声测量校准与RT4工作点收敛
  summary: 噪声测量的有色RC一沿/六沿/246沿解析对照通过；RT4实际LC粗码24已包围目标，首个插值点仍需修正并延长滤波稳定。实际LC Gear2 PSS残差发散，已停止并完整回收，改为6us物理暖启动诊断。新输出链全带与逐模块噪声检查在运行，完整PLL随机RMS仍未知；功耗优化暂缓。
  since_last:
  - 独立1kohm/2pF有色RC、27C、984MHz无噪声源，250fs/1THz/383边带的fresh PSS一沿与六沿八点对照完成。两者PSD最大差0.00043702dB，相对解析协方差谱最大误差0.00145431dB；周期、沿数、端点、斜率及器件PSD求和均通过。未发现该线性模型中的简单sampleratio归一化/混叠错误。不能推广到非等价MOS边沿，未从稀疏有色噪声点积分RMS。
  - RT4/coarse24/TT27/1.2V/Q5/CF10/修复分频器/10fF：0.657998867V与0.75V实测3933.489792与3937.670016MHz，已包围目标。0.713245192V插值点实测RF3935.747062717MHz，偏差-252.937kHz；C1残余1.465507mV。分频/粗码/钳位/窗口检查有效，但100kHz及100uV交接工作筛选均未通过，未撤钳位。
  - C1名义时间常数0.716197us，预测残余1.462449mV，与实测相符；指数模型拟合残差RMS0.306uV。下一点0.718079768V来自更小实测区间，延长至3us，名义残余预测-51.09uV仅作计划依据。全部612个物理状态来自实际终态，仅改变外部强制控制电压；未改写C1、电感或存储位。
  - 方法单变量Gear2实际LC PSS四次完整残差7.77M/611k/1.97M/4.81M，后两次连续增大，末次Newton最大电压修正1.6245V；已对所属进程SIGINT，未取得PSS或PNoise。迭代试探中的SOA告警不能视为实际稳态端口应力。该结果不证明周期解不存在。
  - 停止后的完整初始化原始文件2,529,027,188字节已回收并与远端SHA一致；早前快照恰为其前缀，追加1140字节补齐末记录及END。最终两周期3.884023–4.134023–4.384023us的输出确定性平均提前0.867613ps、C1同相位增加0.739398mV；不是随机抖动。
  - 已释放原PSS槽并启动同电路、同真实初态、1ps/Gear2的6us暖启动，观察601个电压和11个电流状态。当前2.312/6us，结果未完成；先检查内部状态漂移，未自动启动下一次PSS。
  - 已取消尚未启动的两例白RC六点等待器，没有重复派发。4MHz/ratio246/1ps/4095/default maxacfreq的有色RC三点对照也已完成并通过；相对解析PSD最大误差0.00693453dB，相对一沿最大差0.00591723dB，输出246沿及器件PSD求和通过。未从三点积分RMS，也未将线性结果推广到真实MOS。0.718079768V/3us
    RT4细调已接替短槽启动，不自动撤钳位。
  - 严格1ps/reltol1e-5的64us完整复位PLL在2026-10-04T11:05:11.413176+08:00到59.788us，coarse23/DAC36/state5，qualified仍高。为中途观测，尚未完成严格精度的整段验收。
  - 修正尚未用于验收的全状态分析单位分类：64个带冒号的MOS内部节点是电压，不能据冒号当成电流。改用IC显式单位并与原始TRACE交叉校验；物理网表、初始状态及正在运行的仿真均未改动。
  route_confidence: medium
  route_confidence_reason: 已获得解析噪声对照和物理调谐的新证据，也保留PSS失败；尚无可信完整PLL全带随机RMS，不能宣布噪声达标。
