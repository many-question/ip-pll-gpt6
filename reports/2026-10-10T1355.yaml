      0错误/1警告/15通知，2.2µs原始记录含END。实际gear2only、maxstep0.25ps、reltol1e-6、1nV/1pA；Newton、LTE放松、跳断点及最小步长告警均0，无梯形振铃通知。正常回收后再次核对SSD输入与输出：26输入及raw/log/完整终态等7输出前后远端SHA稳定，本地一致；原始波形4398212984字节。独立文本解析5563186个时刻、23信号，和NPZ差异全部0，无重复/截断/非有限值。19初始电压与来源初态差0；终态7863项与初态键集相同，保存电压与波形终点最大差5.11e-15V。初始化、数值干净度、实际状态、完整记录和平稳性五门限均通过；最后1µs有24个参考采样，平均输出983.999939498MHz，RF相位峰峰0.005334828rad、漂移-0.000927844rad/µs，最大RF/输出每参考周期误差0.000542587/0.000144228周期。另列三个短窗口用于诊断，没有代替最后完整1µs门限。方法对照逐项锁定同一RT4电路、完整初态、参考相位、步长、容差、种子及停止时间，testbench唯一变化为traponly→gear2only。1024个匹配输出边沿，Gear减trap的平均时间差70.392327fs、峰峰104.157556fs；仅去均值后的差异RMS为29.458766fs，高偏移频带内差异RMS为10.047888fs。最后1µs平均输出频差85.788271Hz；参考采样控制电压均差0.647408mV。这些是无噪声确定性方法敏感性，不是随机抖动、绝对数值误差底或收敛证明；没有拟合去漂移或挖除杂散。Gear人工阻尼的影响仍需含噪声对照。已接受的短记录高偏移噪声诊断仍为：原版0.5ps
