risks:
- 整机闭环PSS未收敛，整机随机RMS抖动未知。
- 前端负反馈分支非线性，粗采样线性插值曾偏离；平衡点和局部增益须实测。
- 脉冲外净电荷尚未分离镜像动态与位移电流，不能先归因于漏电。
- VCO六点精度与独立组别核验不代替完整频带精度及频率匹配。
- 33频点、全PVT、参考杂散和异常恢复仍有缺口。
