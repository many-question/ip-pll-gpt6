  - name: bias_and_control
    role: 偏置、频点配置及状态控制
    stage: circuit
    maturity: 2
    note: 物理MOS/电阻偏置，不含内部理想电流源。加七只DAC放电MOS并延长自身PSS稳定段后，末尾两个250ns窗口保存电压最大周期差由61.417668mV降为1.522184mV；控制电压周期差由2.409564mV降为36.299770uV，所存DAC关断节点峰值14.039047uV。11个时钟分支计数、coarse23及控制范围通过，但1mV密集周期门限仍失败。电路与稳定时长同时改变，不隔离归因。
      数据窗口5.25–5.75us末尾缺0.395ps记录，显式保留缺口且不外推；初始化轨迹不等于Newton解或随机噪声。 15:27所见新核心四轮Newton范数3.69M/495k/2.53M/6.62M，仍未收敛；状态改善尚未解决所观察到的求解发散。迭代试探中的异常电压不作稳态器件应力或噪声结果。
      本次DAC放电核心PSS终止情况：加DAC放电的AX核心在五轮范数3.69M/495k/2.53M/6.62M/6.55M后主动SIGINT并回收。没有有效PSS/PN；wrapper的crashed分类来自停止后的结果，不能宣称自发软件崩溃。已启动相同冻结电路、612项文本初值和网表精度参数的APS六线程对照；唯一命令差为+aps替代+preset=ax及其override选项，实际日志的1ps/Gear2/容差一致。尚未产生闭环噪声证据。
