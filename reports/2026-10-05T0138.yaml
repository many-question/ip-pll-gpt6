overall:
  phase: 整环数值方法修复及完整电路瞬态噪声配对验证
  summary: RT4瞬态噪声方法六项控制通过，完整RT4候选TT复位完成；已隔离整环容差/状态接续问题并启动完整电路noise-off/on配对，全频带PLL抖动尚未得出。
  since_last:
  - 独立完整RT4/新分频候选的64µs复位仿真已完成：TT27/1.2V/24MHz/K41/M4/10fF/Q5RLC/CF10，4ps/reltol1e-4；53.585643µs完成FLL交接、56.502407µs首次qualification，末窗输出984.000053MHz，phase
    pp0.00459769rad、漂移−0.00090452rad/µs，功能门限通过。全部FLL、watchdog、参考、采样、CP、偏置和控制为实际MOS电路，电感仍为获准Q5 RLC；供电预先建立，不是供电爬升、全频率/PVT或噪声验收。
  - 原生恢复开启MOS噪声的数值恢复未修复；动态参数所谓干净结果实际清零状态，已判无效。新流程在同一次新瞬态中延迟启用噪声。RT4六项控制全部完成且通过原门限，5.28515625–492MHz内：80GHz/.5ps为48.682857fs；160GHz/.5ps为52.606432fs；160GHz/.25ps两种子52.594611/51.366982fs，同频带PNoise53.308683fs；无Newton恢复或跳断点。半步长变化−0.02247%，带宽80→160GHz变化8.05946%，两个细步长种子比PNoise低1.33950%/3.64237%。这是局部高偏移10%方法门限通过，不是整环或1%精度声明。
  - 整环1ps/.5ps原生无噪声接续53个物理节点起点完全匹配，但250ns内仍在调整，128沿19.21875–492MHz步长差469.878582fs，不能当器件抖动。新文本初始化在53节点上与冷终态相符，控制轨迹与原生接续RMS差约30µV；较宽松暖启动随后约0.4µs触发FLL重捕获，已停止，不能作噪声基线。严格1nV/1fA在noise-off中发生恢复，Gear2和去掉观测器均未解决。无VA的5ns单变量对照仅放宽iabstol到1pA即无恢复，仅放宽vabstol到1µV仍失败。100fA、10fA短对照也无恢复；相对1pA的4个早期输出沿最大差分别0.0863fs、833.23fs，故尚不能宣称整环精度闭合。
  - 参考taper2加载真实前端后，按各自实测PAC增益归一化，10kHz/1MHz/10MHz等效相位噪声PSD降低4.963/2.179/1.922dB；三个点不积分为RMS。短尾管CP全噪声也完成，增益归一化后仅改善0.092/0.260/0.275dB，保持为未采用候选。新增偏置独立noise-on通过，前端独立分组现4/6通过；validity/pulser及六组合计尚待完成。
  - 已启动无VA观测器的完整晶体管PLL匹配quiet/noise-on两例，reltol1e-6、vabstol1nV、iabstol1pA、.5ps、160GHz，各2.2µs；noise-on在同次分析的1µs启用，1024沿只测约5.285–492MHz。两例并行、只有完成共同前段、工作点、日志和波形检查才接受诊断值。10kHz–fOUT/2排除离散spur的完整RMS<200fs仍未知，需要后续低偏移记录及数值/统计收敛。原主DUT未改变，功耗及后端优化后置，原规格保留。
  route_confidence: medium
  route_confidence_reason: MOS延迟噪声方法已有独立PNoise交叉证据；完整PLL仍有数值稳定工作点和长记录低频噪声缺口，不能用局部通过替代整环。
