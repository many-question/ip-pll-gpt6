      原基线关断切换本身仍有约35.6–41.2mV瞬态变化，约40uV是新增差值，不是总尖峰；未证明所有64码、真实FLL交接、噪声或全PVT。已启动coredacnoise01/core_dac_discharge_noise_tt，替换为上述七管关断放电DAC，保留实际LC、原RT、CF10、新分频器、coarse23/DAC38/M4、TT27/1.2V/Q5/10fF/refload1.9pF和静态慢控制。精确612初态仍来自原生3.5us终点，不手改电压/电流；PSS自己的稳定段延长250ns→2us，maxperiods6→10，同一1ps
