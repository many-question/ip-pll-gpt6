    "summary": "完整修复PLL在4ps精度完成36µs保持，完整32µs控制周期功耗5.667114mW超标。SS已区分短窗启动、电平恢复和门控负载问题，候选尚未代回。严格复位和整机RMS仍未验收。",
    "since_last": [
      "同一17,644MOS完整DUT36µs保持零错误完成，无restart、qualified全程高；末1µs984.000252MHz。4–36µs供电积分5.667114mW，VCO3.728157、RF接收0.714580、重定时/输出0.131167、其余1.093210mW。",
      "完成实际SS整机RF密集波形提取，新增六例形状对照和八例200ns时钟缓冲对照。原版÷4长窗通过；加倍动态级虽有正确÷2频率，电平仅0.768V。增大恢复级NMOS的六例均失败；恢复原动态级使÷4通过，÷6/10的÷2电平正确但后级门控失败。",
      "门控减载、四/六级缓冲和P/N驱动比例九例对照已完成；÷4通过，但÷6/÷10仍失败。最后混合比例÷6重新翻转，约460.713MHz而非648MHz，仍不采用。",
      "电容单元4.8fF加载端点已完成3例：range48_c0_v10_ss=4166.028MHz,range48_c255_v02_ss=2670.323MHz,range48_c255_v02_tt=2664.688MHz；仅端点，未接入PLL。",
      "物理粗调DFF核心5µs严格稳定段已完成，稳态筛选通过；它仍是裁剪核心，不能作为完整PLL抖动验收。 八线程4MHz PSS/PNoise已启动，周期和噪声检查通过才接续全频带。"
    ],
