  "overall": {
    "phase": "真实LC闭环精度与周期点通过，实际GHz输出链暴露噪声瓶颈",
    "summary": "实际LC固定码核心在累计7–8µs窗口通过1ps/0.5ps接续对照，并取得两组通过独立周期波形和长瞬态核验的PSS解。实际RF接收器已接入输出链并做器件噪声；输出链PSS线性化噪声：镜像小尺寸为8410.26 fs，联合加密通过；直接AC四级大尺寸单次为30034.68 fs，未做该候选数值加密且大噪声下小扰动假设需复核。完整PLL捕获、全带<200fs、≤4mW和<0.3mm²仍未闭合。",
    "since_last": [
      "从相同1ps冷启动4µs物理终态分别以1ps/0.5ps继续4µs；原末窗判据均通过，控制均值差−1.613271mV、输出均值差−38.545Hz、末端相位差−0.000231rad。0.5ps前4µs仍是1ps历史，不称独立0.5ps冷启动。",
      "密集波形独立插值核验事件观察器，并做有/无观察器及1/0.5/0.25ps短窗对照；相位步长差比例接近4，与二阶积分误差主导相符，不作为外推签核。裸preset_override日志确认100nV/100fA；原选择覆盖仍为1µV/1pA。",
      "接受的clamp8_edge_pss：24MHz周期，164VCO/41输出/1参考沿及主谐波吻合；与长瞬态参考相位差0.001051rad、控制差70.279µV。周期平均输出984MHz，真实已连接核心支路2.502772mW；缺完整输出/FLL/发生器。",
      "完整保留不同周期起点及绝对容差的PSS试案；tstab100ns、1µV/1pA试案20次迭代失败，相同tstab下全选项覆盖的100nV/100fA在18次迭代后通过，和长瞬态相位差0.001034rad、控制差81.808µV。与edge试案比较时起点和绝对容差同时改变，不作单因素归因。删去关断分频支路的诊断同时改变RF负载、出现171而非164周期，因此不能作为高阻原因的干净隔离。",
      "RC采样噪声夹具发现Spectre21.1.0.509在PSS24MHz/ratio41时自动Jee对应约12MHz截止，不能直接作492MHz积分。显式PSD积分加密后147.780fs，与PSS984MHz/ratio1的147.815fs及解析148.368fs相符；原组合判据失败保留。历史27个Jee TB静态核查未发现跨PSS半频积分。",
      "实现并比较真实GHz接收器：直流反相器链、再生负载和镜像前端/AC自偏置链；保留全部摆幅/偏置失败。输出功能试案27组，通过4组，仅TT频率/周期/摆幅筛选。",
      "输出链PSS线性化噪声：镜像小尺寸为8410.26 fs，联合加密通过；直接AC四级大尺寸单次为30034.68 fs，未做该候选数值加密且大噪声下小扰动假设需复核。 器件STRUCT总PSD与out²求和交叉核对，镜像候选噪声主要来自接收器；重定时/缓冲本身约228fs也超过目标，须一起调整。旧理想满摆幅GHz时钟噪声结果不再作为实际输出链证据。",
      "根据噪声归因测试去掉镜像前端的直接AC四级链；小尺寸摆幅不通过，大尺寸通过TT筛选后进行单点噪声。尺寸同时改变，不归结为单独拓扑效果；未冻结方案。"
