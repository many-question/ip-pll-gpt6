overall:
  phase: 识别数值振铃并继续实际噪声验证
  summary: 新分频器RT4六点噪声改善保持；已识别随步长移动的梯形法电流振铃，开始方法单变量PSS验证。RT4真实加载失谐及LF初态失配已量化，CF40延长稳定检查继续。整机随机RMS仍未知，功耗优化暂缓。
  since_last:
  - 修复后分频器RT2/RT4六偏移点均完成；周期、支路、六沿、端点及器件PSD求和通过。RT4相对RT2低2.895–3.194dB；RT4新旧分频器变化−0.0080至+0.0117dB，RT2最大+0.0250dB。新RT4全带10k–492MHz及25个谐波邻近点正在运行，尚无RMS结果。
  - 四组20ns实际MOS数值对照完成：梯形1ps/0.5ps的RX电流高频峰由约505GHz移到997GHz；Gear2没有相应分量。按0.125ps重采样，RT电流100–1500GHz能量占比分别0.4933%、2.3397%、0.0008335%、0.0008134%。这是确定性数值振铃证据，不是器件噪声或抖动。
  - 仅改变周期边界的PSS五轮残差7.68M/262k/335k/1.17M/4.87M，仍无周期解。09:05精确SIGINT后SPECTRE18，2.187GB稳定段已回收并校验；保留负结果，不证明无周期解。
  - 已准备并排定方法单变量PSS：只改tstab及shooting积分方法为gear2only，其他电路、实际初态、1ps及容差保持；接替RT4边界点的长槽位。当前状态：running。六点不能积分为RMS，收敛后仍须步长与器件PSD复核。
  - RT4四控制点完成，0.2V点有效性True、RF3936.871922MHz；目标包围状态False。实际触发器D接口码23/24对照已启动，保留同接口控制，不外推或改写动态状态冒充捕获。
  - 40/80/120fF互补采样负载均完成，固定控制输出24MHz确定性PM降低14.327/13.484/8.287dB。40fF在0.657999/0.85/1V的RF为3.913863/3.924146/3.937316GHz，插值预测0.985014V，尚未实测回代。优先噪声，本轮不继续扩大杂散支线。
  - 调谐扫描残留LF储能：RT4下调100/250mV后C1与控制相差35.357/88.432mV；40fF上调至0.85V后差−67.980mV。钳位频率有效，但撤钳位前必须实际预充或稳定，不能直接据此判闭环失败。
  - CF40已使用自身真实3us终态启动额外6us实际闭环稳定检查，尚无完成结果；先前只有相位漂移未通过门限，独立VCO低偏移改善不能替代实际PLL噪声。
  - 严格64us完整PLL在2026-10-04T09:17:29.662197+08:00观测到54.790us，coarse23/DAC36/state5、主环已接管、qualified仍低；只是进度，不是最终锁定结果。
  route_confidence: medium
  route_confidence_reason: 局部器件噪声和数值振铃有独立对照；真实LC周期解、整机RMS及候选闭环工作点仍未关闭。此信心针对诊断方向，不代表指标达标。
