- 回收自然结束结果，优先给低端/高端/127到128码重叠粗结论；夹具与完整PLL的捕获结果分别汇报。
- 整环64us独立复位期间qualified低正常；不使用原噪声失锁保护，不因小数值方法或种子差异追加对照。
- 原版V14的bw320、ringtrap和ringgear三项任务按用户授权已停止；保存证据，不自动重派。
- 快速筛查完成后按发现的覆盖或捕获问题决定必要修正，先避免新增大矩阵。功耗优化和版图仍后置。
