overall:
  phase: 噪声候选审计与真实LC参考调制定位
  summary: 局部4倍输出链暂定63.275fs的自身六沿验证通过，2倍FF单独noise-on通过。真实LC端发现强参考相关周期调制，已形成固定控制隔离试验和MOS dummy候选。实际LC基线稳定性改善，但完整PLL随机RMS仍未知。功耗与后端优化继续后置。
  since_last:
  - 真实LC诊断核心的3.75–4.00/4.00–4.25µs两个无噪声初始化窗口，输出−24MHz线分别−28.80013/−28.79996dBc，+24MHz约−28.926dBc。FFT与独立时域积分相符，强线插值加密差<0.002dB。尚非收敛PSS、最终稳态或完整PLL验收，按明确风险处理。
  - 24MHz调制已在LC差分端出现，折合确定性时间峰值11.159ps，输出11.654ps，两者波形相关系数0.99534；参考保持/跟踪RF差10.229MHz。方波调频估算约−29.39dBc支持采样负载假设，但控制纹波、电荷注入和其他直接参考耦合尚未分离。该ps量级周期扰动不是随机RMS。
  - 4倍尺寸六输出沿三偏移点检查通过，最大PSD差0.03047dB；2倍独立FF-only与fresh总噪声对应器件贡献最大相对差1.11e-16，通过。2倍其余4组及4倍5组noise-on继续，三个频点不替代全带/PVT。
  - 真实LC四组3µs/1ps比较的基线完成通过，末窗输出983.999994MHz、相位峰峰0.0001063rad、漂移−8.18e-5rad/µs；粗调23与供电保持。RT4/CF40/组合继续，不作噪声、CF40最终偏置稳定或冷上电结论。
  - 固定控制端的5个实际MOS隔离实验已启动，750ns/1ps、末500ns密集保存，接替已完成分频批次释放的1线程，尚无结果。互补MOS dummy的40/80/120fF候选仅准备，待隔离结果审阅。较稳定基线终态612个物理节点已准备仅改变readic的PSS对照，待四组结果及长任务槽位；两类候选均未采用到主PLL。
  - 连续时钟分频候选新增端口批次17/17完成并通过，含五个SS低RF、六个TT高RF及六个FF高RF；结合此前SS高RF，共11个不同SS规划端点通过。固定SS形状零阻抗RF重放，不替代实际LC全频率/PVT/整机。
  - 完整PLL严格64µs复位继续，2026-10-04T06:18:43.365060+08:00观察46.658/64µs、粗调23、DAC35、state0、qualified低；仅进度，不判最终失败或通过。
  route_confidence: low
  route_confidence_reason: 局部随机噪声改善有更多独立证据；真实LC参考线离−60dBc较远，闭环有效周期态及完整PLL RMS仍缺失。
