  verification:
    maturity: 3
    note: 4倍尺寸六输出沿三偏移点检查通过，最大PSD差0.03047dB；2倍独立FF-only与fresh总噪声对应器件贡献最大相对差1.11e-16，通过。2倍其余4组及4倍5组noise-on继续，三个频点不替代全带/PVT。真实LC诊断核心的3.75–4.00/4.00–4.25µs两个无噪声初始化窗口，输出−24MHz线分别−28.80013/−28.79996dBc，+24MHz约−28.926dBc。FFT与独立时域积分相符，强线插值加密差<0.002dB。尚非收敛PSS、最终稳态或完整PLL验收，按明确风险处理。24MHz调制已在LC差分端出现，折合确定性时间峰值11.159ps，输出11.654ps，两者波形相关系数0.99534；参考保持/跟踪RF差10.229MHz。方波调频估算约−29.39dBc支持采样负载假设，但控制纹波、电荷注入和其他直接参考耦合尚未分离。该ps量级周期扰动不是随机RMS。连续时钟分频候选新增端口批次17/17完成并通过，含五个SS低RF、六个TT高RF及六个FF高RF；结合此前SS高RF，共11个不同SS规划端点通过。固定SS形状零阻抗RF重放，不替代实际LC全频率/PVT/整机。
