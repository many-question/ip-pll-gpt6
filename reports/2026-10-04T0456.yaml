  - 4倍输出链匹配六点精度完成0error：1ps/383对0.5ps/767/maxacfreq504GHz，最大PSD差0.01455dB，通过0.2dB判据；2倍已通过0.01275dB。自身六输出沿与五组fresh-PSS独立noise-on均在运行。TT27/1.2V/984MHz/10fF，外部无噪声RF重放；未证明全频带/PVT/整机。
