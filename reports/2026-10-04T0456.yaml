  - 修正电源初态后，coretripsupply01周期残差3.7e6→75.3k→340k→2.1e6，在四个残差后主动停止。1.9GB量级稳定段回收；最后250ns运行分支沿数正确，已检查电压端点差最大0.429mV，但PSS未收敛、无PNoise，状态无效。只收紧线性求解itres=1e-6的同电路对照coretriplinear01已启动，维持最终准确度。
