risks:
- 完整PLL<200fs尚无有效证据；局部噪声不能直接合成或代入完整PLL。
- RT4从原近锁定初态滑相，加载频率曲线与重新交接待实测；不能用局部63.275fs跳过实际LC功能检查。
- 固定控制保留参考PM，仍须区分采样负载、电荷注入和其他直接路径；工作点变化阻止把99.3%当作唯一贡献比例。
- 完整内部状态未证周期稳定；仅两个端点的差异不能唯一归因为缓慢充电，也不能证明PSS失败根因。
- 三点noise-on/六点精度/六沿不能替代全带、谐波邻近、PVT；CF40短时结果不能代替最终偏置或供电启动。
- 严格捕获、33点、输入负载、全PVT和恢复仍缺；功耗及后端优化后置，目标保持。
next_steps:
- 完成固定控制5例，得到DC保持/跟踪差及KVCO，审阅后选择dummy验证；检查副作用。
- 完成CF40/组合真实LC，再在释放槽位内测RT4加载控制曲线和重新交接；不直接采用局部最小RMS方案。
- 完成RT2/RT4其余fresh noise-on，继续全带精度/谐波邻近/PVT；按完整内部状态证据选择下一个PSS初始化对照。
- 继续严格64µs完整PLL捕获，保持全频率/输入负载/角落/恢复的最终目标；功耗和后端暂缓。
