overall:
  phase: 真实LC耦合诊断与低噪声候选工作点修复
  summary: 固定控制实验保留近乎相同的参考周期调制，直接耦合路径得到实际器件证据。局部RT4低噪声候选代回实际LC后从旧初态滑相，先测加载频率曲线再调整交接；不采用到主PLL。局部noise-on继续通过，完整PLL
    RMS仍未知。
  since_last:
  - 固定VCTRL=0.657999V、正常24MHz参考的实际MOS例已完成0error并通过诊断筛选；两段250nsRF差1.79ppm。相同500ns边沿谐波拟合下，LC/输出24MHz PM幅度分别保留99.863%/99.332%，复相位分量变化1.279%/2.265%。钳位后仍有显著直接参考耦合；RF均值也变化+1.299MHz，不能把剩余幅度当作单个器件贡献比例。DC保持/跟踪与KVCO仍在验证。
  - 参考DC低/连续跟踪例也完成并通过，平均RF3932.665587MHz、两窗差0.896ppm；LC/输出24MHz边沿PM拟合幅度为1.37e-5/3.40e-6rad，明显低于时钟例。小值受拟合与数值残差限制，不据此推算杂散或随机RMS；DC保持与±10mV仍在运行。
  - 实际LC的RT4仅尺寸变化对照完成0error但近锁定失败：末窗RF3944.017724MHz、输出986.004435MHz，相位漂移+50.3637rad/µs；同条件原尺寸基线983.999994MHz通过。50ns以后4×fOUT/fRF最大相对误差4.83e-6，RF本身偏高约8MHz，不能直接归因为分频漏沿。共同初态、固定慢控制，不证明重新FLL捕获一定失败；RT4不采用到主PLL。
  - 局部fresh-PSS独立noise-on：2倍已通过ff,buffers,rx共3/5组，4倍已通过ff共1/5组；两者自身六沿与匹配六点精度此前已通过。1MHz/100MHz/491.99MHz三点归因不替代全带、谐波邻近、PVT或整机。
  - 实际基线初/终态相隔3µs同激励相位比较：601个电压中35个变化>1mV，最大10.930mV；两个端点不能区分初始跳变与后续慢变。28个相同复位计数锁存NAND与局部fresh-PSS的端点管脚最大差4.08µV，代表内部栈仍相差16.996mV。外部稳定不足以证明所有内部状态周期稳定，尚未证明是shooting失败根因；没有据此改初态。
  - 为RT4准备三档实际LC固定控制试验0.657999/0.632999/0.607999V，各750ns/1ps；只在目标被实测曲线包围时插值新的交接试验点，再实际闭环复核。尚未运行；需现有实验完成审阅并释放槽位。dummy和仅更换实际基线终态的PSS也仍只准备。
  - 完整PLL1ps严格64µs复位继续；2026-10-04T06:53:15.785941+08:00观察48.210µs、coarse23/DAC35/state1、qualified低，仅进度。
  route_confidence: low
  route_confidence_reason: 已把局部降噪与实际LC失锁分开，也验证了控制钳位后仍存在参考调制；完整周期状态、重调后功能及PLL随机噪声仍缺。
