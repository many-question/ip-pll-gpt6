    maturity: 3
    note: 局部fresh-PSS独立noise-on：2倍已通过ff,buffers,rx共3/5组，4倍已通过ff共1/5组；两者自身六沿与匹配六点精度此前已通过。1MHz/100MHz/491.99MHz三点归因不替代全带、谐波邻近、PVT或整机。固定VCTRL=0.657999V、正常24MHz参考的实际MOS例已完成0error并通过诊断筛选；两段250nsRF差1.79ppm。相同500ns边沿谐波拟合下，LC/输出24MHz
      PM幅度分别保留99.863%/99.332%，复相位分量变化1.279%/2.265%。钳位后仍有显著直接参考耦合；RF均值也变化+1.299MHz，不能把剩余幅度当作单个器件贡献比例。DC保持/跟踪与KVCO仍在验证。实际LC的RT4仅尺寸变化对照完成0error但近锁定失败：末窗RF3944.017724MHz、输出986.004435MHz，相位漂移+50.3637rad/µs；同条件原尺寸基线983.999994MHz通过。50ns以后4×fOUT/fRF最大相对误差4.83e-6，RF本身偏高约8MHz，不能直接归因为分频漏沿。共同初态、固定慢控制，不证明重新FLL捕获一定失败；RT4不采用到主PLL。实际基线初/终态相隔3µs同激励相位比较：601个电压中35个变化>1mV，最大10.930mV；两个端点不能区分初始跳变与后续慢变。28个相同复位计数锁存NAND与局部fresh-PSS的端点管脚最大差4.08µV，代表内部栈仍相差16.996mV。外部稳定不足以证明所有内部状态周期稳定，尚未证明是shooting失败根因；没有据此改初态。
