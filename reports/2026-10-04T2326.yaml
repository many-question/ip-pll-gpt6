      PSS试验；主PLL未替换。 静止时钟复位节点清除通过；运行时钟内部栈峰值仍有7.53–9.46mV，先前1mV门限失败保留。PSS失败是否由该节点导致尚待核心实测。 实际LC核心初始化片段已回收，覆盖3.50–5.067103µs；3.601370µs后1081个采样点中，28个复位内部栈节点最大绝对值为3.599363µV。此时尚未开始shooting迭代。原始未完成文件逐字节保存，完整记录前缀两次hash一致；另存加END的解析视图。采样间隔最大1.600ns，所以不能作为高速峰值、周期误差、RF频谱或功耗证据；结果支持复位清除在核心中起效，尚不证明PSS收敛。
      新增：回收并校验2,277,933,056字节的核心初始化原始波形，末尾不完整记录已排除。密集区间5.25–5.7499992024µs，实际最大保存步长约1ps。候选全部28个计数器复位栈节点的原始样本最大绝对值为3.641548µV；共同观察的6个节点从前序候选的29.793416mV降到3.641211µV。已核对同一文本初值、相同其余物理依赖、1ps
      Gear2和2µs初始化；此比较只改变XCOUNT的复位清除电路。复位栈清除核心试验已于20:57主动停止：两次完成的Newton范数3.68e6、495e3，第二次耗时2640s，超过7200s总保护时间的剩余约900s，因此结束这次有界试验并释放资源。已核验对应PID消失，回收终止日志、结果、取消记录及5.25µs原生初始化检查点；前一轮2.278GB初始化轨迹仍保留。没有已接受PSS或PN；不把主动停止称为数学上不存在周期解。
