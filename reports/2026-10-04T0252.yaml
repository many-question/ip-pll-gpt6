risks:
- 当前MOS PSS状态复用会改变噪声结果；未查清前只能使用新求解PSS作性能依据。原失败结果保留。
- 局部90.867fs不包含VCO/主环/参考噪声或LC加载反作用；完整PLL抖动未知。
- 新尺寸候选仍缺全边沿/maxacfreq/步长/边带及谐波邻近检查，当前积分仍为暂定。
- 核心PSS可能继续不收敛；须检查实际周期、初态及动态存储节点，不能放松残差制造通过。
- SS分频、严格冷启动、33点及温度覆盖、输入/负载边界和杂散仍未闭合。
- 功耗超标及后端面积/PEX保留为已知缺口；CF40pF候选增加偏置启动时间，尚未运行。
next_steps:
- 回收4倍完整频带噪声，与2倍按同口径比较；候选使用fresh PSS补noise-on、不同边沿及数值收敛。
- 检查corerestart01收敛轨迹，通过周期/工作点检查后再做闭环完整频带和分模块noise-on；不复用未验证MOS PSS噪声流程。
- 检查两例SS恢复级单变量结果，以逐周期电平和时序通过为门槛；合格后补六档和实际LC回归。
- 保持严格64µs复位运行，完整回收后按既有strict分析入口核查捕获；不重启同一测试。
- 利用释放的单线程检验CF40pF VCO-only六点候选，并核对工作点/启动代价；不把六点积分或自由振荡结果写成PLL jitter。
- 经噪声与功能验证后代回完整PLL，继续频率、PVT及杂散测试；保留功耗与后端待办。
