overall:
  phase: MOS噪声复用问题隔离、CMOS局部噪声优化与闭环PSS恢复
  summary: 2倍CMOS重定时/输出候选完整频带暂算90.867fs，新求解全噪声和FF-only三点复核通过。已隔离当前PSS复用流程导致的MOS噪声偏差，暂停以其结果验收。闭环PSS仍待收敛，无完整PLL RMS结论；主DUT未替换。继续前端指标闭合，暂缓功耗和后端优化。
  since_last:
  - 2倍尺寸候选TT27/1.2V/984MHz/10fF，外部无噪声RF重放下全10kHz–492MHz暂算90.867fs，基线141.281fs；边沿斜率20.410GV/s，FF贡献70.029fs、输出两级RSS52.510fs。候选仍待全边沿/数值/PVT/闭环核查。4倍PSS已收敛、完整频带噪声进行中。
  - 五组noise-on与源结果冲突。新增全噪声复用对照同样偏高，1/10/100MHz的PSD比为2.592/4.564/5.049；复用内部五组贡献相加一致。重新求解PSS的总噪声最大相对差3.17e-13，FF-only贡献最大差1.19e-13，排除频点设置及噪声开关本身，问题定位到当前复用流程。底层原因尚未确定，RC校准不推及MOS。
  - 相同闭环寄存器核心2µs稳定段/Gear2仍迭代发散，已停止并回收失败证据。新测试使用skipdc=yes、tstart=5µs并避开参考跳变开始shooting，物理电路和容差不变；仍在运行，无闭环PNoise。
  - SS连续时钟两档×M6/10/14六例全部0error完成但功能失败，q1频率及逐周期摆幅通过，后级脉冲仍衰减。新两例单独改变恢复级上拉或切换阈值，按既有资源预算接续验证。
  - 完整PLL严格复位继续运行，02:30为36.57/64µs，粗调23/DAC36、FLL搜索；只是未完成轨迹，不计通过。
  - 针对已有VCO-only结果中偏置滤波电阻约20%的1MHz噪声贡献，准备仅CF10pF→40pF的独立候选和六频点TB，尚未运行；需检验新增偏置稳定时间。
  route_confidence: low
  route_confidence_reason: 局部改善有新求解噪声对照；整机闭环噪声、SS接口、严格捕获、全频率/PVT和杂散仍未闭合。
