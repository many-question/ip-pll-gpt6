report:
  seq: 45
  time: '2026-10-04T14:06:08+08:00'
  trigger: proactive
  covers_since: '2026-10-04T13:22:51+08:00'
overall:
  phase: 噪声优化实测、周期解诊断及完整候选集成
  summary: 新分频器RT4的五组独立噪声归因闭合，实际LC暖捕获通过；已构建并启动完整晶体管候选复位仿真。VCO滤波有约4%高偏移RMS收益，单纯增大电流反而恶化1MHz噪声。完整PLL抖动尚未验收，继续优先噪声和抖动。
  since_last:
  - 新分频器RT4在TT27/1.2V/984MHz/10fF、无噪声零阻抗RF条件下，FF、缓冲、接收器、分频器、辅助五组独立noise-on全部通过。1M/100M/491.99MHz处贡献之和与全开总谱最大相对误差1.78e-15；六沿PSD最大差0.034727dB。每组重新求解PSS；不使用曾产生冲突的MOS
    readpss复用。全带积分及谐波邻域连续1/f资格尚未关闭。
  - 实际隔离VCO、原固定M4/10fF负载、TT27/1.2V/Q5/c23/ctrl=.679V、参考DC0、仅XV noise-on，CF10和CF40的密集谱均完成。以共同上限491.757312MHz积分1MHz以上，等效时序RMS为172.637766fs和165.697321fs，改善4.020%。CF10的1ps/127到.5ps/255全网格精度复核通过，最大PSD差0.010071dB；CF40更细.25ps/511复核状态见结果。自由振荡器近线宽频段不用于10kHz起的整机验收。
  - CF40隔离VCO另测bias_r=2500→2000ohm，其余条件一致；载波振幅增加14.814%，RF下降1.153%，但实际载频归一化后1MHz时序PSD恶化1.405dB。MT尾管1MHz贡献恶化3.688dB，其flicker占比从53.62%升到67.48%；交叉耦合对改善不足以抵消。此候选未采用；未重新匹配目标频率，六点不积分。
  - RT4/c24/CF10/新分频器实际LC闭环，经原生状态从3us续跑至4us，末窗相位pp=0.00391756rad，漂移=0.00410282rad/us<原0.01门限；RF/输出每参考周期计数误差5.32429e-05/1.68719e-05，控制0.718836–0.778486V，全部暖捕获工作判据通过。第一次3us漂移失败与此前钳位匹配失败记录保留。该结果不是独立复位或噪声/PVT验收。
  - 独立候选pll_capture_rt4bank_v14只替换新分频器和RT4，保留完整真实FLL、watchdog、控制、偏置、参考、采样、CP和LC电路。rt4bankcold01以TT27/1.2V/24MHz/K41/M4/10fF/Q5/CF10、4ps/1e-4/trap从复位运行64us；无warm
    seed，电源预先建立并保留原10uV差分启动种子。已请求8/16/32/48/64us原生检查点。仍在运行；原主DUT不变，CF40、增流、4.8fF及互补采样负载均未采用。
  - 原RT实际核心在无观察器、无强制strobe的原生3–3.5us续跑中，密集周期最大电压差0.594396mV，全部612状态端点最大0.549552mV，11支路计数及10ppm载频筛选通过。随后使用其精确612文本终态启动fresh-PSS，原生历史不能跨tran/PSS混用。PSS初始化相邻250ns窗口最大电压差升为61.417668mV；末记录未完整落盘，仅比较每段249.999086ns实际数据，缺失0.914312ps，不外推。状态重建与数值步点变化是待查因素，尚未确定根因。
  - 截至2026-10-04T14:05:23.316213+08:00，核心PSS尚无有效周期解，完整残差历史：Conv norm = 3.73e+06, max dI(VDD:p) = -5.74738 mA, took
    2.48531 ks.；Conv norm = 499e+03, max dV(XP.data) = 126.315 mV, took 2.99788 ks.；Conv norm = 2.22e+06, max dV(XP.data)
    = 528.391 mV, took 2.81896 ks.。它保留实际模拟/输出电路，但慢控制静态固定；即使三点PN成功也不等同完整PLL或全带积分。
  route_confidence: medium
  route_confidence_reason: 局部噪声归因和真实暖捕获已有可复查证据；周期PSS、实际闭环传递、整机积分及全范围功能仍未关闭。
