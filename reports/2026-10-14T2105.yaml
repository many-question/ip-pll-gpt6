- 这是理想偏置与控制钳位的局部RT4负载夹具，不能直接等同整环自然稳态。控制0.48V、钳位0.728V的3941.066MHz与整环末段3939.186MHz仍相差约1.88MHz；夹具去除了偏置RF纹波且负载/历史不同。因此偏置变化是有量化证据的影响因素，但不能据此断言唯一根因或原粗码19绝对不可锁定。
- 新试验仍是外部固定码的局部诊断，没有改完整PLL控制器、没有强制粗码作为修复成功。原4.4fF、仅4.8fF、单步、可变步长及局部夹具证据分开。可变步长完整PLL仍失败，最差测频828.660ppm；旧4.8fF三低端6.821ppm不能继承。115.2fs仅原RT4高偏移阶段依据；最终10kHz至fOUT/2排除杂散RMS<200fs不变，功耗与版图后置。
- 偏置、粗码与细调相互影响；真实滤波网络短记录仍不能证明渐近稳态或闭环捕获。
next_steps:
