overall:
  phase: RT4：偏置敏感性有证据，真实偏置相邻粗码验证中
  summary: 短诊断确认VCO对滤波偏置敏感：偏置提高10mV使RF降低19.58–19.88MHz。该幅度足以影响启动选码；已转入恢复真实偏置网络的相邻粗码短验证。
  since_last:
  - 固定粗码19：偏置0.728V时，控制0.20/0.48/0.84V对应RF3938.203336/3941.065603/3955.914790MHz；偏置0.738V时，对应3918.535434/3921.487385/3936.034783MHz。六段分频比均通过。低偏置钳位下最低测试控制电压仍比3936MHz目标高2.203MHz，高偏置钳位下0.84V接近目标。
  - 2.4µs局部试验已正常结束；1201有限点、PSF END、退出码0、零错误、输入/raw/日志/final.ic哈希核验；两次终态观察相隔超过60秒且稳定。Spectre耗时7分52.8秒；请求2线程，工具因电路较小实际关闭多线程。
  - 这是理想偏置与控制钳位的局部RT4负载夹具，不能直接等同整环自然稳态。控制0.48V、钳位0.728V的3941.066MHz与整环末段3939.186MHz仍相差约1.88MHz；夹具去除了偏置RF纹波且负载/历史不同。因此偏置变化是有量化证据的影响因素，但不能据此断言唯一根因或原粗码19绝对不可锁定。
  - 新任务rt4freebias107ssd01/rt4_freebias107_tt，仅一个3µs TT短任务、2线程，仍AX8ps/1e-3/traponly/noise-off。恢复原VCO的1MΩ/10pF真实偏置网络，仅初始nfilt=.728V并在t=0释放；依次测试粗码19/控制0.20V、粗码20/控制0.20V、粗码20/控制0.84V，各1µs。比较最后300ns频率和偏置漂移，检查相邻粗码调谐余量。
  route_confidence: medium
  route_confidence_reason: 短受控试验已量化偏置引起的频移，支持先核对调谐边界再改FLL；仍需真实偏置网络和完整MOS闭环确认。
