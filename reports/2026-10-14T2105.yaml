- 正常终态后核验输入/raw/日志/final.ic哈希与1501点0–3µs完整有限波形；调用review_rt4_freebias107.py <本次已含final_state_sha256的审计JSON> <新的输出JSON>，避免审计与runner最后下载阶段竞争造成缺字段，禁止覆盖已有输出。
- 分析原真实偏置网络下粗码19与20的条件调谐边界、分频和漂移，再决定如何让控制器用新计数自动修正选码；不把局部强制码当完整PLL通过，不直接增加长记录预算或扩展频点/角落/方法/种子矩阵。
