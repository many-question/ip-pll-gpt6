overall:
  phase: RT4：真实偏置调谐诊断完成，二分复测K41验证中
  summary: 真实偏置网络短诊断显示目标附近有调谐余量；已改用新计数二分细调搜索，并启动唯一984MHz完整MOS验证，捕获结果待定。
  since_last:
  - 3µs局部诊断：粗码19/控制0.20V，末300ns RF均值3932.989719MHz；粗码20/0.20V为3922.517264MHz，粗码20/0.84V为3939.165705MHz。后两点夹住3936MHz目标；三段÷4均通过。恢复真实1MΩ/10pF偏置后，不能认定粗码19最低频率仍高于目标。
  - 1501点0–3µs有限物理波形、PSF END、退出码0、零错误、输入/raw/日志/final.ic哈希全部通过，两次终态观察相隔335.410秒稳定。Spectre实际耗时9分52.6秒；请求2线程，局部电路实际单线程执行。
  - 58项映射后门级测试通过：6项含异步计数的完整流程，52项复测定向测试含全部43个合法DAC目标、上下越界、无可表示合格码、扰动、连续两次合格及八次预算。综合1430门；只证明逻辑，不能替代MOS时序、模拟单调性和实际锁定。
  - 独立二分复测候选rt4bracket108ssd01/rt4r48_rebracket108_k41_tt：保留原粗码/细码SAR流程，复测入口弃用旧最小误差码，从合法DAC区间11..53中点32起，根据每次新计数缩小区间。连续两次误差≤1且同DAC才交接；区间耗尽或8次预算耗尽报错不使能。粗码仍由硬件SAR选择。保持32参考周期等待、128周期测频、120µs上限及AX8ps/1e-3/traponly/noise-off，只跑K41
    TT一项、4线程。
  route_confidence: medium
  route_confidence_reason: 局部真实偏置结果支持优先改用新计数搜索；完整PLL中的偏置漂移、单调性和真实锁定仍待验证。
