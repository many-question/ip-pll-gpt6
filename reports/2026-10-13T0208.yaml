risks:
- RT4 4.4fF低频覆盖不足：336MHz完整PLL未锁定，粗码255、细调近下限，输出偏高2.3034%；其余低RF点仍待结果。
- 984MHz AX粗码22后未锁定，末段输出988.646MHz；此前4ps粗码24已锁定，当前未隔离因果，不将频率误差<0.5%当锁定。
- 本轮整环仅完成4/7代表点，不构成全频点/PVT/噪声验收。
- 当前115.2fs为高偏移单工况最差观察，非10kHz全带或PVT最坏上界；完整RT4杂散仍未知。
- RT4功耗8.050093mW高于4mW；Q5临时电感、理想R/C及实际接口未定，可能改变最终尺寸和性能。
- 完整33点、供电启动、切频/恢复、关键角落和失配尚未闭合。
