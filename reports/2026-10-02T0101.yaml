    "since_last": [
      "同一实体输出链逐项开启XD、XM、XS、XL和重定时偏置/无源；另有全开/全关，七组正式试验均通过。两个混合noiseon/noiseoff选项旧试案警告保留，分频和主锁存器以单一开关重跑后确认。",
      "五项RMS贡献499.141/328.094/367.099/355.045/105.903fs，独立方差和对应792.983fs；全关为0、关闭分区PSD为0，周期电压、功耗和斜率与全开相同。",
      "八个单模块物理改版六个通过频率/摆幅；分频末级减半和输出TG增大四倍均落在约656MHz，保留失败记录并停止其噪声筛选。",
      "六个有效改版只开启被改模块噪声。主/从锁存器、输出首级和偏置去耦分别降低所改模块噪声37.35%/30.19%/26.43%/63.96%；分频末级加倍和减少输出级数反而变差。",
      "四个有意义候选恢复全噪声，独立单开与全开器件谱一致。仅输出恢复首级MOS宽度加倍，整链加密结果 621.903 fs、1.760363 mW；相对原细网格 792.149 fs 降低 21.49%。主锁存器加倍也完成联合加密；从锁存器与偏置全开保持粗网格探索标识。",
      "输出首级改版的±10ps回放诊断：零移位匹配通过，输出上升/下降时序增益 0.3552/0.3274；内部0.1目标未通过，不代表全局setup/hold或PVT签核。",
