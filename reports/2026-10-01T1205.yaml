    "phase": "关断分频输入的 MOS 钳位、严格容差闭环及周期工作点验证",
    "summary": "新增 24 个 MOS 钳位关断分频输入，六档最高规划频率静态分频 6/6 通过；真实 LC 环路末窗稳态筛选通过项：loop_base_continue, loop_clamp_strict。钳位版 1 ps 功能精度复核未通过；五组完整终态启动的 PSS 尝试均未取得通过独立波形检查的真实 LC 闭环周期解。尚无新闭环噪声结果，完整 PLL 捕获、<200 fs、≤4 mW 和 <0.3 mm² 仍未签核。",
    "since_last": [
      "复核服务器身份和 PDK 哈希。显式强制 Spectre X 的 reltol=1e-5、maxstep 和 traponly；日志中的绝对容差仍是 1 µV/1 pA，未把网表意图当作实际设置。",
      "独立 DC 检查发现关断输入对 gmin 敏感：1 pS 改为 0.1 pS 导致约 60.909 mV 变化。加入受选择控制的互补传输门后约 0.583 µV；改善实际偏置路径，未用仿真器电导代替电路。",
      "原版和钳位版在实测形状的理想 RF 回放驱动下均通过 24 MHz PSS 和 164/41 周期检查。因此不能把完整闭环周期求解困难归因于分频器单独没有周期解。",
      "钳位版在 ÷4/6/8/10/12/14 的各自最高规划 RF 频率、TT27、1.2 V、10 fF 下 6/6 通过。固定 3.936 GHz 快速换挡压力测试仍有 3/6 未通过；五档超过其规划 RF 上限且含建立过程，完整动态接管未签核。",
      "实际 LC 固定码环路复核：原接口 2 ps 为 -0.016372、钳位 2 ps 为 +0.008722、钳位 1 ps 为 -0.022251 rad/µs。末窗沿用相位峰峰 <0.02 rad、漂移绝对值 <0.01 rad/µs 等既有判据；1 ps 功能精度复核未通过。",
      "原接口从 4 µs 完整状态继续 4 µs，累计 7–8 µs 窗口漂移 +0.000147 rad/µs；这是状态接续，不标成未中断的 8 µs 仿真。",
      "回收并核对全部终态，将物理状态及参考相位保留用于 PSS。只移除观察器方程，上传状态逐项核对哈希；终态与保存波形的重合节点差异低于 1e-10。",
      "五组完整终态启动的 PSS 尝试均未取得通过独立波形检查的真实 LC 闭环周期解；另做 itres=1e-6 内部线性求解及 gear2only 积分法对照。writepss 同时按工具文档请求收敛后有限差分细化。Gear 的 Newton 试探进入数十伏非物理区域后保存新鲜完整日志并主动停止；记为取消试案，不是实际电路过压证据。",
      "独立分频器器件噪声通过联合数值加密：原版 995.140 fs、钳位版 995.050 fs，差 -0.091 fs，小于数值加密变化，未分辨出明显噪声代价。TT27、1.2V、无噪声实测形状理想 RF3.936GHz、÷4、10fF，0.6V 上升沿、10kHz–492MHz；原始分频输出附加噪声，不含实际 VCO 阻抗回注或输出重定时。"
