    note: 全晶体管实现；主DUT仍为原尺寸，RT4为独立候选。新分频器RT4逐模块noise-on已完成3/5组；触发器和输出缓冲在1M/100M/491.99MHz三点与全开启噪声中的对应贡献分别吻合至7.77e−16和5.55e−16相对差，排除组贡献均为0。RX组也已完成；分频器/辅助组及全带积分仍待完成。六沿三点一致性证据保留。
