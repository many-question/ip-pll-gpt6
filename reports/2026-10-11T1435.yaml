- Gear seed29完成后按真实退出、完整raw和哈希回收，独立复核，与自有Gear quiet配对；结合已完成traponly seed11/29形成方法×种子对照，保留有限记录和数值阻尼不确定性。
- 原版320GHz noisy完成后与自有quiet配对，再与160GHz 100fA基线比较；保持内部梯形振铃独立风险，安排内部节点观测与积分方法匹配quiet诊断。
