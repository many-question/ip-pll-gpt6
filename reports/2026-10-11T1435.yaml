- 两套TB逐字比较仅积分方法traponly改gear2only，物理电路、初态、参考相位、容差、步长、种子、源带宽和时长一致，各用自己的quiet。梯形法/Gear高偏移RMS为95.862398905/102.495945208fs，相差6.633546303fs（6.919863%）；带内实现差值RMS为51.180979fs，相关系数0.868939。相同种子在自适应步长/不同积分方法下不代表相同激励；该差异混合有限记录与方法敏感性，不能作为绝对数值误差界。Gear可能存在人工阻尼，本次结果不能关闭方法收敛问题或支持采用RT4。波形差值在记录边界较大，因此补做窗敏感性诊断。矩形窗主结果保持不变；采用sum(w²)噪声能量归一化的对称Hann窗，梯形法/Gear分别为100.399943/100.463361fs，差异0.063166%；两条残差首尾差为-0.059365/0.444034ps。窗函数改变有限记录权重和泄漏，不能独立分离物理低频噪声、求解误差与泄漏，也不能选择较低数字替代既定主结果或由此宣称方法收敛。
- 原版320GHz quiet在1.92753µs内部节点XP.XC.XF.X57.XS.XN.x的梯形振铃风险继续开放：该节点未保存，振幅未知。RT4 Gear结果不能消除此原版风险。原版320GHz噪声尚未完成，不能报告带宽收敛。
- 最终10kHz至fOUT/2、排除离散杂散、RMS<200fs仍未知。原版和RT4仍分开；RT4未采用。原版既有0.5ps seed11/29为195.390405/163.650060fs，0.25ps 1pA为172.507488/160.410117fs；RT4
  0.5ps为100.669316/112.993992fs，0.25ps为95.862399/103.195977fs，均是相同TT理想外部条件下的高偏移短记录。方法/带宽/更多种子/记录长度及完整离散杂散分类未闭合。33频点/完整PVT/MC/真实输入与负载/供电爬升/PEX仍缺；功耗超4mW、面积未验证，功耗优化及后端后置。
  本轮新增RT4 Gear seed11高偏移102.495945fs；Gear seed29正在运行，不能将该记录代替原版结果或全带验收。
