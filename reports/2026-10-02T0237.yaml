    "since_last": [
      "按用户指示继续CMOS，记录DEC-0006；新增低摆幅单级自偏置接收器和轻时钟负载TSPC重定时器，继续使用实体有缓冲TSPC /4。",
      "保留多级DC链摆幅退化/漏边沿失败；多级AC链可运行但约1.6–6.0ps且接收器主导噪声。单级方案将理想低摆幅源下整链降至181.186fs，精度变化+0.00954%。",
