  "overall": {
    "phase": "SS CMOS时序故障诊断与条件性功能修复",
    "summary": "实际LC驱动下SS60恢复正确÷4；较轻候选IREF180µA、码24/0.2V/Q5/1.2V/10fF输出约983.85MHz、测试电路4.3946mW。0.5ps、1µs反向微扰和TT27/FF0定点功能通过；完整4mW、修改后的噪声及全频PVT仍未闭合。",
    "since_last": [
      "定位两级问题：首TSPC反馈/评估竞争，以及重定时窄幅qb脉冲无法使首缓冲充分下拉；有频率的q0或正确分频data都不足以证明输出链通过。",
      "首FF反馈NMOS门极串50kΩ（PMOS仍直连），配合级间缓冲WN2/WP4µm恢复分频；同RF、同分频器下仅改重定时缓冲比例恢复输出。20kΩ反馈对照在实际LC仍失败。",
      "主修复实际LC SS200µA通过、4.8872mW；接收器32/80降到24/60µm，重定时FF scale2降到1.2并局部调整缓冲，SS180µA降至4.3946mW。160µA及两个末轮局部变体仍不通过，保留失败证据。",
      "较轻SS180µA加密步长RF变化0.003512%、功耗变化−0.007565%，功能及逐周期电平均通过；1µs反向10µV微扰试验后500ns通过，492个输出上升沿。",
      "同一较轻电路/IREF180µA在TT27与FF0也正确÷4，但固定码输出约981.87/975.28MHz、功耗4.6322/4.7185mW，不代表984MHz锁定。",
      "121组全部输入和原始结果回收，117组正常结束、15组功能通过。3组模型最小宽度违规与1组重复include失败原样保留。没有新的噪声签核。"
    ],
