overall:
  phase: 前端噪声贡献和动态增益已测量，开始定向尺寸优化
  summary: 前端器件噪声与四点相位频响已完成：参考缓冲主导10kHz噪声，1–10MHz由参考缓冲和CP共同占主要贡献。六组独立noise-on已启动，参考缓冲尺寸候选开始独立验证。完整PLL抖动仍未验收。
  since_last:
  - 前端三个频偏的器件噪声全部完成，10kHz/1MHz/10MHz钳位电流ASD分别为1.95317/0.828138/0.691356pA/√Hz。全部器件贡献与总噪声的求和误差为2.22e−16；参考缓冲贡献70.855/38.042/33.595%，CP为7.771/33.995/39.789%，采样器为19.363/19.734/18.446%。这些是三点的方差贡献比例，不是积分抖动贡献。
  - 10kHz时参考首级XREF.X0.MN占总前端噪声58.220%，其闪烁噪声项约占该管贡献93.9%。提前回收的完整10kHz记录及已接受PSS波形，与最终原始文件逐字节前缀/hash吻合；不再依赖未完成文件做结论。
  - RF相位端口1V=1rad的fresh PSS+PAC完成；10kHz复数增益与独立静态扫描的相对误差为0.085713%，通过预先2%门限。10kHz/100kHz/1MHz/10MHz增益幅值为0.445904/0.446061/0.446515/0.373430µA/rad，相对于负静态增益的相位为−0.0410/−0.4168/−4.7642/−43.3452°。10MHz幅度相对静态下降1.53656dB，不能用静态Kphi替代全频率响应。
  - 使用对应频点的实测增益，前端输入等效RF定时噪声ASD为0.177118/0.074995/0.074861fs/√Hz。未插值、未积分；没有闭环环路滤波器、VCO及FLL传递，不能当作完整PLL输出抖动。
  - 六组独立noise-on流程已启动，顺序为参考缓冲、CP、采样器、偏置、检测、脉冲；每组重新求PSS，按全开器件归因的原0.1dB门限核对。当前进度以流水状态和实际进程为准，未将未完成组标为通过。
  - 参考缓冲尺寸候选已启动独立噪声对照：NMOS宽度从1/4/16/64µm改为8/16/32/64µm，PMOS同比、L180nm，保留末级。独立条件为TT27/1.2V/24MHz10ps理想输入/2pF集总负载，积分10kHz–12MHz；该负载不含实际非线性采样器回耦，输入源阻抗也未加入。候选尚无性能结果，需精度、PVT、重平衡与前端回代。
  - 复位清除候选完整14位计数器：TT27,SS60,FF0通过各30个进位/回卷/复位检查。三配对角全部通过后，独立诊断核心（原RT、CF10、固定慢控制）的28只复位节点放电MOS候选已进入fresh PSS试验；主PLL未替换。
  - 同载频VCO六点数据的分解确认：1MHz处总噪声PSD下降的96.33%来自尾管；尾管闪烁噪声贡献降低5.994dB，候选剩余噪声的44.25%来自交叉耦合对。该工作点尚未重新做独立组noise-on；不是纯面积效应。匹配工作点三批密集谱仍在进行。
  route_confidence: medium
  route_confidence_reason: 从器件噪声定位到参考缓冲和CP，动态增益也得到独立校准；完整PLL闭环及PVT缺口仍在。
