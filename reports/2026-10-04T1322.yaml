overall:
  phase: 噪声归因复核、VCO滤波候选与周期状态验证
  summary: 四组对照确认事件观察器会影响核心的数值轨迹；继续建立不带观察器的实际周期状态，并补充VCO偏置滤波的密集噪声谱。完整PLL随机RMS仍未验收，功耗优化后置。
  since_last:
  - 同一实际LC/原RT/CF10/新分频器/coarse23/M4/TT27/1.2V/Q5/10fF、同一612项初态、750ns/1ps Gear2：不带观察器的无strobe/有strobe两组最大周期电压差为9.458241/9.737522mV，均未通过1mV筛选；带观察器的无strobe/有strobe两组为0.601107/0.511088mV，均通过原工作筛选。平均实际步长只从约0.739ps降至0.724ps。证明事件步点对当前轨迹有影响，不能据此认定带观察器结果是物理解或已收敛。
  - 新分频器RT4逐组noise-on完成4/5组（ff, buffers, rx, divider），已完成组的三点贡献复核全部通过；1M/100M/491.99MHz、TT27/1.2V/984MHz/10fF/无噪声零阻抗RF重放。六沿间最大PSD差0.034727dB。稀疏三点不积分，不代表完整PLL；全带及连续1/f谐波邻域资格尚未关闭。
  - 已启动vcobiasband01三项串行fresh-PSS：CF10/.5ps/255sidebands、CF40/.5ps/255、CF40/.25ps/511；10kHz–492MHz、20点/dec。实际隔离VCO/原固定M4负载/参考DC0/TT27/1.2V/Q5/c23/ctrl.679V，仅XV器件noise-on。只在≥1MHz积分，使用所有已完成案例实测RF/8的最小值为共同上限。CF40只改变滤波电容10pF→40pF，未采用进主DUT。
  - 不带观察器/无强制strobe的3us核心稳定仿真已完成，0errors；全部612项终态及输入hash核实。原生状态已回收，本地/服务器SHA256一致。已启动corenativeperiod01，从3us原生状态续跑至3.5us，保留全部计算点、相同物理和数值设置；日志确认Restarting
    at time 3us。500ns密集周期结果尚未完成，未启动PSS。
  - RT4/c24/CF10/新分频器、TT27/1.2V/Q5/10fF、1ps/trap，实际撤钳位3us已完成。末1us相位pp=0.0142106rad，漂移=0.0150905rad/us，RF/输出每参考周期计数最大误差=0.000187825/5.09672e-05，控制范围=[0.7181011844264363,
    0.7777155011995094]V，功能暖捕获未通过。保留原调频筛选失败；没有把此次捕获当作复位启动、周期PSS、噪声或PVT验收。 仅相位漂移超过原0.01rad/us门限；RF和输出计数、相位pp、控制范围、粗码均通过。已回收原生状态并启动rt4release02续跑3–4us，1ps/trap和电路不变。
  route_confidence: medium
  route_confidence_reason: 归因和数值对照有实测进展，但真实闭环噪声传递及整机全带抖动仍未知。
