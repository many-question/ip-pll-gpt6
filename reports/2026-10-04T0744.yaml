- 完整PLL随机抖动尚无有效结果；旧链器件噪声不能直接代替修复后分频器负载或实际LC闭环。
- RT4和RT4+CF40旧工作点滑相；CF40仍欠稳态，不能直接采用低局部RMS候选。
- 新PSS初态对照尚无结果，内部弱连接节点是否导致失败仍为假设。
- 参考负载补偿可能增加噪声并改变频率/捕获；未实测前不宣称改善。
- 33频点、严格捕获、输入负载、全PVT及恢复尚缺；功耗和后端暂缓，指标保持。
