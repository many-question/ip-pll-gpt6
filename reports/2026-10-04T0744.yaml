overall:
  phase: 对齐真实候选的噪声电路并修复周期状态
  summary: RT2旧链五组noise-on闭合，修复后分频器的两档RT噪声对照已启动；真实LC四组显示尺寸与偏置候选尚不能直接采用。新基线初态PSS对照正在运行，完整PLL RMS仍未知。
  since_last:
  - 旧分频器局部链RT2五组fresh noise-on全部完成并通过，独立PSD相加对全噪声最大相对差4.44e-16；六沿三点最大差0.009579dB。RT4通过ff,buffers,rx共3/5组，仍继续。范围为1MHz/100MHz/491.99MHz，不是全带或完整PLL。
  - 核对出既有141.281/90.867/63.275fs局部尺寸结果使用旧cmos_even_bank_acq_v14，而实际LC候选使用修复后的bank_pulsetrip_v14，时钟活动和加载不同。新RT2/RT4六点测试只替换分频include/实例，其余物理依赖、TT27/1.2V/984MHz/10fF和0.5ps/767边带条件保持，已接替RT2审计单线程启动。旧分频器全带加密暂缓；旧归因证据不直接转移给新电路。
  - 四组实际LC3µs对照全部完成：基线通过；RT4滑相；CF40漂移−0.015315rad/µs超筛选；RT4+CF40输出986.203865MHz、RF3944.816010MHz、相位漂移+55.472481rad/µs，仍滑相，分频比最大相对差5.81e-6。均非随机噪声或全PLL验收；未采用候选。
  - 释放六线程已启动基线coretriplate01：只换成真实追加3µs后的612条状态，保持相同电路、250ns周期、1ps、容差和默认itres，检验初始化影响。尚无有效PSS或PNoise；没有移植局部夹具内部节点，也未调松验收。
  - 基线DC跟踪控制降低10mV结果完成并通过，RF3932.293993MHz，对名义点的单边静态斜率37.159MHz/V。原RT4控制扫点50mV跨度按此量级只有1.86MHz，因此将未运行RT4试验改为0.657999/0.557999/0.407999V。原输入和协议保留；这一推算只选跨度，不外推RT4实际性能。五例均已完成并通过，中心差分KVCO=37.915054MHz/V；静态KVCO乘原控制纹波估算输出PM峰值0.000579rad，仅约已观测参考PM的0.8%量级，属于一阶数量级比较，不是严格路径分解。
  - 互补dummy三例的有限接续状态为running_three_dummy_controls；只使用原单线程短槽位，尚无补偿改善结果。
  - 严格64µs完整PLL继续；2026-10-04T07:38:18.828793+08:00观测50.254µs、coarse23/DAC35/state1、qualified低，仅进度。
