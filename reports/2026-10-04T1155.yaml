      PSS六点试验的对应点最大差7.75e-11dB。仍不是全带或完整PLL结果。三点沿间电压噪声PSD最大差仅0.000507dB，而斜率换算带来0.034441dB差异；斜率约30.984–31.107GV/s。因此本例约0.035dB的沿间时序PSD差主要来自小幅斜率差，不是某一沿噪声异常放大；不外推至未测频率/PVT。新RT4五组独立noise-on目前已完成并纳入审计1/5组，全带10kHz–492MHz及25个谐波邻域点仍在运行。旧局部63.275fs不替代新电路或完整PLL。RT4粗码24的0.718079768V/3us细调仍在运行，未撤钳位。
