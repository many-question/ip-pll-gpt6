overall:
  phase: RT4：二分交接后未锁，自动粗码余量修正验证中
  summary: 二分复测已交接但完整PLL仍未锁定，随后监督器重启；已启动按新计数自动修正一档粗码的独立984MHz候选。
  since_last:
  - 完整120µs二分候选失败：六次复测DAC32/21/15/12/11/11，误差+6/+2/+2/+2/+1/+1；粗码19。94.588µs使能PLL，qualified始终低，115.920µs监督器重启，未报range_error。PLL使能期间输出平均984.389321MHz、最差测频偏差537.165ppm；重启前最后1µs平均984.405402MHz、最差481.263ppm。末1µs已是重启后的搜索，799.501247MHz均值不属于稳态。
  - 60001点0–120µs有限物理波形、PSF END、退出码0、零错误、输入/raw/日志/final.ic哈希通过，两次独立终态观察相隔102.499秒稳定。Spectre耗时13小时46分2秒，23,918,460个接受步；4请求线程。求解正常完成与捕获失败分开。
  - 68项映射后逻辑检查通过：6项完整异步计数流程、62项定向检查；综合1609门。涵盖正反向粗码调整、0/255边界、不重置八次预算、修正后清除旧合格状态及两次同码确认。部分边缘理想模型在预算内来不及二次确认，按设计报错；通过指断言符合预期，不表示全部模型都捕获成功。完整MOS锁定尚待本次仿真。
  - 独立4.8fF候选rt4center109ssd01/rt4r48_recenter109_k41_tt保留原SAR和新计数二分：DAC≤15且新计数偏高时粗码加1，DAC≥49且偏低时粗码减1；最多一次，越界不回绕。修正后DAC从32重新搜索11..53并清除旧合格计数，仍共用原八次总预算；连续两次同粗码/DAC误差≤1才交接。没有强制绝对粗码，四码边缘余量是待验证的设计假设。仅一个K41
    TT120µs、AX8ps/1e-3/traponly/noise-off、4线程，32参考周期等待/128周期计数、监督器及模拟电路均未改。
  - 晶体管几何审计已保留：已采用基线及108输入各94条MOS定义均显式AD/AS/PD/PS，常用AD=AS=W×240nm、PD=PS=2×(W+240nm)；不是展开实例数。未找到240nm来自PDK PCell/CDF或版图提取的依据，属于项目几何假设。未显式填写SA/SB/SD、SCA/SCB/SCC、NRD/NRS；未审计PDK内部默认效应，因此不能声称没有LDE。新候选未改变这些几何约定，版图准备前仍需核实真实器件几何和多指/共享扩散规则。
  route_confidence: medium
  route_confidence_reason: DAC11处两次+1计数满足原复测门限，但RF观察仍约3937.3–3937.4MHz，且PLL使能后控制电压上升、相位未持续合格。细调低端余量不足是下一步修正假设；计数量化、模拟偏置漂移及交接相位仍未隔离，不能认定唯一根因。局部真实偏置粗码20端点3922.517264/3939.165705MHz仅支持邻近粗码可能有效，不是整环锁定证据。
