  - 单步候选末1µs平均985.775009MHz，范围985.752384–985.798655MHz，最大绝对测频偏差1827.901ppm；qualified/frequency_good始终低。DAC44→37，8次新计数误差+18/+15/+15/+13/+12/+11/+10/+8，106.920µs报range_error，无enable、HANDOFF或restart。频偏不是抖动。
  - 原远程任务已退出，退出码0、Spectre零错误、PSF END、60001点0–120µs有限物理波形、final.ic及输入/输出哈希独立核验通过；无Newton/LTE/skipped恢复标记。日志唯一警告为已弃用AHDL环境变量。
  - 回收103首次在哈希其持有的Windows锁文件时失败，原始数据已完整下载。新增104回收脚本排除该锁后成功完成，保留102/103原脚本。新队列的互斥锁放在research流水线旁，避免与runner输出哈希冲突；启动期尚无raw视为待运行，不能判为完成。
  - 新候选保留4.8fF模拟电路、SAR、32参考周期等待、128周期计数、连续两次误差≤1及最多8次。仅把复测修正改为max(1,min(4,floor(|误差|/2)))码，饱和在11–53；到达边界仍不能纠正则报错。粗码仍由真实计数选择，不强制成功码。
  - 11项完整映射门图时序测试和8项步长/饱和/边界保护测试通过。新控制器1550门、整环20,813 MOS；这些逻辑结果不替代实际MOS捕获。
  - 新任务rt4stepk41ssd01 / rt4r48_recheckstep_k41_tt，远程PID363559、SSD目录9542c565已实查，1长任务4请求线程；K41/TT27/1.2V/24MHz/10fF，120µs、AX8ps/1e-3、traponly/noise-off，不增加频点/角落/种子/方法矩阵。
