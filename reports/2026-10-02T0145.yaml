  "overall": {
    "phase": "数字噪声机制诊断与 CMOS 输出链实现",
    "summary": "CMOS是优先研究方向：同PDK/1.2V下缓冲85.247fs、对称C2MOS重定时与缓冲87.002fs；实体CMOS /4加重定时链130.272fs/1.150115mW，反相时钟102.681fs/2.081006mW。均完成联合加密，但外部RF为理想全摆幅源，真实LC接口及完整PLL仍未签核。",
    "since_last": [
      "复查旧CML选择缘由：为绕过具体GHz电平恢复器噪声问题，并无证据证明当前频率必须CML；按用户意见优先CMOS，未冻结主架构或改变需求。",
      "保留实体CML链的内部电压及42个MOS动态工作点：分频数据仅0.182V/0.534V每ns，恢复首级栅仅0.226V/1.035V每ns，而最终输出约25.85V每ns；尾管VDS-VDSAT整个观测窗为负，不能仅看输出边沿或盲目整体增宽。",
      "同条件CMOS缓冲尺寸/输入边沿单因素实验确认尺寸近1/sqrt比例降噪；s2/s4加密85.247/58.883fs。旧C2MOS从级弱PMOS恢复对称后，scale4即87.002fs/0.878977mW；50ps时钟同相位85.796fs。",
      "TSPC直接串接摆幅不足，增加级间缓冲后3.936GHz至984MHz /4通过；静态TG两尺寸和C2MOS分频试案失败并保留，不用于推断CMOS极限。",
      "实际TSPC /4与C2MOS重定时/输出相连，两种物理时钟极性均通过瞬态及PSS：联合加密为130.272fs/1.150115mW、102.681fs/2.081006mW；没有理想数据源。直接链只开启XD/XR得到96.467/87.495fs，PSD/方差闭合1.22e-15。",
      "40组仿真全部回收并验证输入哈希；27噪声测量有效、7组联合加密通过。四个初始瞬态start设置错误的试案独立保留并重跑，9个有效协议瞬态5通过/4失败。电压回放噪声等效差9.41%，明确拒绝作为实体链替身。"
    ],
    "route_confidence": "low",
    "route_confidence_reason": "CMOS单元及连接链获得显著进展，但全摆幅GHz驱动代价、真实LC加载、全频PVT与完整PLL噪声/4mW仍未闭合。"
  },
