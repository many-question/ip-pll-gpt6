risks:
- 当前RT4仍为4.4fF电容单元，最低RF覆盖风险尚需关闭；4.8fF仅有独立端点证据。
- 当前115.2fs为高偏移单工况最差观察，非10kHz全带或PVT最坏上界；完整RT4杂散仍未知。
- RT4功耗8.050093mW高于4mW；Q5临时电感、理想R/C及实际接口未定，可能改变最终尺寸和性能。
- 完整33点、供电启动、切频/恢复、关键角落和失配尚未闭合。
next_steps:
- 新增验证以RT4采用清单为准；既有原版任务跟随原保护和回收，不重复派发或扩大。
- 优先评估2.688GHz低端及粗细调重叠，再做33点TT和分频边界/端点角落；独立电容候选如合入需重新验证。
- 补真实上电、切频、失锁与参考恢复；按薄弱点筛角落和关键失配。
- 补10kHz全带噪声和完整RT4杂散；保留有效结果最大值，不再扩大小方法/种子差异研究。
- 明确工艺无源和接口；功耗与后端仍后置，进入最终版图定型前安排功耗处理及交付约束。
