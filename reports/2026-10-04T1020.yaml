overall:
  phase: 噪声候选工作点收敛与测量交叉验证
  summary: CF40候选的实际LC暖启动慢漂移已收敛；RT4工作点通过真实粗调下移，继续细调。新输出链全带噪声、六沿/逐模块noise-on和长周期积分校准正在进行；实际LC PSS仍未通过，整机随机RMS未知，功耗优化暂缓。
  since_last:
  - CF40实际LC使用自身3us终态追加6us、1ps/TT27/1.2V/Q5/原RT/10fF完成0error。第2至6个1us窗口均通过原稳态门限；末窗输出983.999999038MHz、相位峰峰6.160883e-05rad、漂移7.406821e-06rad/us，解决此暖启动工况的慢漂移。不是冷上电、PSS或整环噪声验收。
  - RT4实际MOS粗调D接口码23/24对照均完成：RF3944.573458/3933.489792MHz。同码23接口对照相对原夹具仅−9.533kHz、摆幅−0.000634%，通过250kHz/0.5%门限；粗码24可继续向上细调。0.75V单点已接替释放的短槽启动，不外推或改写动态储能。
  - Gear2实际LC初始化快照已校验2,529,026,048字节及SHA。末两250ns输出各246沿，但共同提前0.867613ps，C1同相位终值增加0.739400mV，显示残余确定性漂移；不是随机抖动。当前完整残差历史：Conv
    norm = 7.77e+06, max dI(XP.XV.XL.XP.LW:1) = 15.5452 mA, took 2.93894 ks.；Conv norm = 611e+03, max dV(XP.XR.ob)
    = -182.96 mV, took 1.84923 ks.尚无有效周期解。
  - 识别到运行中PSF末记录被缓存截断：稳定文件哈希不代表记录完整。保留原始文件，舍弃唯一不完整记录，截止最后完整点4.384022182742564us，仍比较整两个250ns。用既有完整原始文件回归，全部原测量行和时间窗完全一致。
  - 修复后分频器RT4全带10kHz–492MHz及25个谐波邻近点仍在PNoise，尚无新RMS。已启动对应新电路六个输出沿和FF/缓冲/RX/分频/辅助五组独立noise-on，每例fresh PSS；旧电路验证不直接转移。
  - 独立RC的4MHz PSS已收敛，但dec20 PNoise约15分钟仅到25.1189kHz，已主动SIGINT并完整回收；不是电路失败，没有合格噪声结果，原细网格例未运行。改为10k/1M/2M/10M/100M/492MHz六点，对照解析采样RC协方差；理论谱纹波界小于4e−22，适用于此线性热噪声校准。1ps/default
    maxacfreq与0.25ps/1THz两例已有限排队在0.75V调谐点之后。逐点PSD、解析积分及自动Jee/2MHz边界均须核对；不能代替实际MOS全频带、非等价边沿或完整PLL验证。
  - 严格64us完整PLL在2026-10-04T10:13:27.842825+08:00已到57.380us，coarse23/DAC36/state5，qualified=高。仍为中途观测，需跑完并核对保持、锁定时间及精度差异。
  route_confidence: medium
  route_confidence_reason: 新增实际器件功能进展和独立测量检查；尚无可信闭环全带RMS，不能据局部数字链低噪声宣布整机达标。
