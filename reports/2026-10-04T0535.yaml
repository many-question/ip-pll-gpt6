overall:
  phase: 噪声候选验证与闭环周期状态诊断
  summary: 2倍采样沿一致性通过，4倍63.275fs局部结果继续独立审计。收紧itres未解决所观察核心PSS发散，已保存负结果并将算力转入真实LC四组候选对照。完整PLL RMS仍未知；功耗与后端优化继续后置。
  since_last:
  - 2倍局部输出链六个上升沿完成0error，1MHz/100MHz/491.99MHz处最大PSD差0.00958dB，通过0.2dB判据。五组fresh-PSS noise-on继续；4倍自身六沿及noise-on继续。TT27/1.2V/984MHz/10fF，外部无噪声RF重放，不替代全带或整机。
  - itres=1e-6单参数对照四次范数3.7M→75.3k→340k→1.23M，05:29主动停止，未用满10次。1.975GB初始稳定段完整回收；无PNoise，无有效周期解。未证明最终不能收敛，但所观察窗口未恢复收缩。
  - 已回收的修正供电瞬态末两个250ns逐节点比较：保存电压最大轨迹差0.829mV，主要时钟沿共同漂移约−0.021ps/250ns，各分频沿数相同；不是随机jitter，未覆盖隐藏内部状态。形成安静shooting边界的波形依据，尚未运行该假设。
  - corenoisecand01实际LC四组3µs/1ps近锁定对照已启动：基线、RT4、CF40、RT4+CF40。原等待RT2线程的wrapper已停止，改用已停止核心PSS释放的6线程；不重复任务、不增加总线程。尚无完成结果，不作噪声/冷启动验收。
  - 连续时钟分频候选新增六档TT27高RF接口测试全部通过，与五个本批SS低RF通过例组成11/17已完成；结合此前SS高RF，11个不同SS规划端点已通过。FF0六档继续。固定SS形状重放，未覆盖实际LC/PVT或33点整机。
  - 离散杂散方法通过解析AM/PM/单边带及独立时域积分校验。已有局部链原/2倍/4倍最大已表示谱线−70.285/−72.035/−78.535dBc；4倍强谱线粗细精度最大差0.01328dB。仅164MHz网格，无参考/LC/慢控制，非整机REQ07通过。验收频带提案未确认。
  - 完整PLL严格64µs仍运行；05:31观察44.552µs，尚未qualified，仅进度记录。
