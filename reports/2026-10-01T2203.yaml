    "phase": "差分CML输出链实现与噪声瓶颈定位",
    "summary": "两级CML原极性scale2输出链 792.149 fs；已连接分频/重定时/输出 1.723996 mW。联合加密积分变化 -0.1051%，最大谱差 0.00916 dB，判据通过。比旧实际GHz接收链显著改善，但仍超过200fs，且有限时序扰动仍传到输出；未代回实际VCO，完整PLL功耗/噪声/面积不签核。",
    "since_last": [
      "新增原始差分分频输出、单/双CML重定时及984MHz再生输出试案，RF形状源保持理想无噪声；16组实体输出功能试案12组通过，4组失败保留。",
      "反馈电阻从50k降低到5/2/1k的三个GHz链均失去逻辑摆幅，未继续噪声测试，不能用失败电路较低功耗支持方案。",
      "单级CML同相/反相首轮噪声977.67/2558.30fs；两级原极性首轮792.98fs，反相1088.19fs。差分再生c原极性/反相1073.81/1403.44fs，b反相1363.69fs，均未加密；b原极性PSS30次不收敛，无噪声结果。",
      "两级CML原极性scale2输出链 792.149 fs；已连接分频/重定时/输出 1.723996 mW；联合加密积分变化 -0.1051%，最大谱差 0.00916 dB，判据通过。每例周期/谐波/摆幅/积分及器件PSD求和独立核对；未把valid_noise当作200fs达标。",
      "18组±10ps数据回放诊断：四种普通CML回放通过零移位匹配，但输出敏感度仍为0.41–2.09量级；再生b原极性/反相两种零移位匹配失败，不解释其敏感度。内部|gain|<0.1为研究筛选而非新增用户需求。",
      "当前较好版本的高偏移频段主导方差，分频器、主从锁存器和输出恢复级均有明显贡献；仅对调极性或替换恢复级未解决噪声。43组记录全回收并核对输入哈希，包含1组PSS收敛失败。"
    ],
