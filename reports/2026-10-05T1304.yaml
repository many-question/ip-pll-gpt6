risks:
- 同0.5ps的原生接续和文本初始化，前250ns控制电压RMS差0.641µV、滤波电压差0.0454µV、相位差3.03e−5rad。RF误差一度约+1.253MHz后逐步下降，但相位已从0.641移到1.650rad，慢滤波电压仅变化约2.4mV。证据支持精度突变先改变有效频率、模拟状态未平衡便被四次相位失败规则重启；尚未证明最终细精度锁定点能保持。没有修改相位窗或屏蔽重启。
- 渐进精度只可用于初始化；恒定精度噪声与低偏移记录必须另验。
- 10kHz–fOUT/2、排除离散spur的完整随机RMS<200fs仍未知。短记录、高偏移结果及局部RT4约52fs方法检查均不替代整环验收；功耗与后端优化后置，全部原规格不变。
- 200ns全PLL短噪声试验的真实Spectre日志显示，请求noisefmin=1MHz被按1/stop提高为5MHz，noisefmax仍为160GHz。本机Spectre帮助说明noisefmin以下的源PSD被保持为常数，并非把低频噪声删除；因此不能把请求值或短记录当成低偏移噪声覆盖。原协议和所有仿真输入未改；日志字节、26项输入哈希及原客户端失败manifest已记录。
next_steps:
- 短试验真实终止后由现有保护脚本回收，分别审阅严格协议不匹配和噪声开启方法检查；不输出RMS。
- 完成原版恒定精度quiet门限，通过后由已运行的本地链派发同DUT噪声；失败则保留并继续定位。
