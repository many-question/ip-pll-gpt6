- CF40增加偏置充电时间；抽取静态尾端的子电路不能替代真实振荡器和完整PLL上电启动。
- 新分频候选通过固定窗口不等于启动/重配置/PVT/真实LC/全频点均通过。
- 闭环PSS仍需解决，不放宽残差制造通过；其前置严格瞬态也必须有完整末窗证据。
- 严格完整复位、输入/负载边界、杂散及33点/PVT未闭合；功耗和后端缺口保留但暂缓优化。
