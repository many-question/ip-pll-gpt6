overall:
  phase: 噪声候选优化、严格数值复核和分频接口修复
  summary: 功耗优化继续暂缓，优先噪声/抖动。VCO偏置CF40pF六点相噪改善已验证；输出链4倍局部暂算63.275fs、2倍90.867fs，尚非整机验收。SS固定长窗六档通过，新分频器在真实LC诊断核心3µs稳态筛选通过，新核心PSS已启动。旧核心失败保留，无完整PLL
    RMS。主DUT未替换。
  since_last:
  - VCO仅CF10→40pF，新求解PSS/实际器件噪声0error完成；10k/100k/1MHz改善6.679/7.442/0.865dB，频率+0.00433%、载波幅度+0.193%。1MHz滤波电阻输出PSD降到原来的8.78%；尾管闪烁项仍占总方差17.0%，已准备W/L比不变的单管尺寸候选。六点不积分RMS。
  - 已完成抽取偏置子电路充电诊断：CF10/40pF达到各自终态99%的时间分别为55.73/193.67µs。实际MOS参考和镜像栅负载，尾端钳在实测均值；这不证明VCO或完整PLL上电启动。
  - 尾管W/L比不变的W300/L1→W600/L2µm试验0error完成：1MHz相噪降低0.662dB，但10kHz恶化1.610dB，RF频率−0.956%、载波幅度+9.81%；相近工作点判据失败，不采用，不能把变化仅归因于同工作点尺寸收益。
  - 六档均通过SS60／1.2V／10fF、实测SS形状重放＋真实MOS接收器、600ns固定400–600ns窗口筛选；旧120–200ns失败保留。非实际LC/整机验证。
  - corerestart01采用skipdc/匹配绝对时间后仍发散，SIGINT停止、700.6MB稳定段回收。最后250ns沿数正确，但RF/输出端点仍有差异。SPECTRE-18出现在停止之后，记录完整，不误报为已完成噪声。
  - 新的连续时钟分频器接入真实LC及采样环诊断核心，保持CF10、原RT和环路器件，3µs/1ps完成0error并通过末1µs筛选：984.000049MHz、相位峰峰0.001121rad、漂移0.001112rad/µs、粗调23保持。新fresh4MHz
    PSS/六频点探针已启动，仍非完整PLL。
  - 启动2倍候选相同六频点1ps/383对0.5ps/767/maxacfreq504GHz核查；只有差异<0.2dB才接续六输出边沿及五组fresh-PSS noise-on。继续禁止以当前readpss MOS结果作性能依据。
  - 4倍尺寸候选全频带完成，局部暂算63.275fs，尚缺其自身noise-on/精度/边沿/PVT检查。
  - 严格64µs完整复位继续运行，尚未得到最终捕获结果；不重启或以进度冒充通过。
  route_confidence: low
  route_confidence_reason: 局部噪声和SS接口有可复查改善；完整PLL噪声、严格捕获、全频率/PVT及杂散仍未闭合。
