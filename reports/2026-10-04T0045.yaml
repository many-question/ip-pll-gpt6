resources_note: 当前严格复位8线程、核心PSS8线程、局部链1线程，共17请求线程；2倍单模块noise-on仅在其完成后启用1线程，与排队4倍同时运行最多18线程。不重复启动旧失败任务；两个接续程序均为本次有限实验，非周期自动化。
