risks:
- PSS失败使闭环噪声尚不可评估；初态重启扰动及内部动态存储节点的数值条件仍待验证。
- 2倍/4倍尺寸会改变时钟和数据负载，需要验证净噪声改善、PVT与原位闭环行为；不根据尺寸比例推断RMS。
- 固定慢控制核心省略逻辑活动、部分实际控制输出阻抗/参考负载、外部源噪声和PEX，不能直接签核整机。
- 采样噪声的不同边沿、maxacfreq/边带、步长及谐波邻近积分仍有缺口；用户排除spur不等于可以移除随机噪声。
- 主DUT SS部分档位、完整33频点、全PVT、严格精度、面积和PEX未关闭；功耗5.667114mW的超标事实保留。
next_steps:
- 优先检查coregear01周期解；有效后有限接续coregearband01，失败保留证据并诊断内部状态，不重复启动无效状态。
- 完成chainrtscale01的2倍/4倍局部全频带比较；2倍结果通过后按FF、缓冲、RX、分频、辅助负载分别noise-on核对1/10/100MHz贡献。
- 对改善候选补不同边沿、步长/maxacfreq/边带和谐波邻近频点，再验证完整PLL实际加载；目前不代回。
- 继续既有严格完整复位，完成后检查与4ps基线的功能及工作点一致性。功耗优化及新增无关扫描暂缓。
