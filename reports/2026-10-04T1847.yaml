    stage: circuit
    maturity: 2
    note: VCO尾管/偏置、交叉耦合管、电感RLC、电容阵列四组独立noise-on全部完成；每组重新求解PSS。在1/10/100MHz频偏，与全开器件归因的总和相对误差最大1.013988ppm，四组贡献核查通过。条件为TT27/1.2V、Q5
      RLC、CF40、MT560µm/2µm、码21、控制0.7411690578V、静态参考、固定M4/10fF。三点不积分RMS。.25ps/511边带到.125ps/1023边带的六点检查均通过：基线载频变化43.721ppm，最大PSD差0.037703dB；MT560候选为8.605ppm、0.005464dB。候选与基线在这档精度的载频差仍为−153.984ppm，未通过100ppm门限。旧载频失配结果保留。另一次仅将交叉耦合对W120→80µm的实际器件试验完成。载频变化+6.921992%，载波幅度变化+3.413739%，电源电流变化-0.104507%。1/10/100MHz的总定时PSD分别变化+0.074050/+0.065802/+0.055431dB，未显示噪声收益；因载频不匹配，也不能作为严格同载频优劣结论。目前不采用。
      既有1MHz起高偏移带积分约154.53fs，不是10kHz起的闭环PLL抖动。VCO尾管候选的新控制电压为0.753032567247V；实测载频残差-0.750716ppm，通过原100ppm门限。在10kHz、100kHz、1MHz、10MHz、100MHz、492MHz六个频偏处，候选相对基准的定时噪声PSD变化分别为-0.438952dB、-1.097701dB、-0.762836dB、-0.411057dB、-0.359738dB、-0.364806dB。条件为TT27/1.2V/Q5πRLC/CF40/静态参考/固定÷4/10fF，仅XV开启噪声；fresh
      PSS、.125ps步长及1023边带。候选MT560µm/2µm、c21，基准为原尾管/c23/控制.679V。载频约3.9348GHz；幅度与电流也改变，因此不能把全部改善归因于面积。六点不是积分结果；旧154ppm及119ppm失配负结果保留。已启动vcomatcheddense01：候选.25ps、基准.125ps、候选.125ps三个单线程串行任务，各95个频点。与既有基准.25ps密集谱组成两个独立数值精度检查；相同设计和偏置下保持.1dB
      PSD、1%积分及100ppm载频门限，比较匹配工作点的高频段积分。当前尚无新密集谱结果；不将自由VCO的低频谱当作闭环抖动。
