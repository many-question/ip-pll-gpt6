overall:
  phase: 模块噪声数值精度、VCO同载频对照与电荷泵动态诊断
  summary: RT4在SS60和FF0的完整频带噪声精度检查通过，分别约87.37fs和38.84fs；VCO同载频对照通过，六点定时噪声PSD降低0.36–1.10dB，已补跑密集谱。CP尾部端电流已与内部电阻性电流区分。整机抖动仍未验收。
  since_last:
  - 重定时器RT4与两级缓冲的SS60/FF0完整95点器件噪声精度复核完成。 SS60：87.406257→87.373404fs，积分变化-0.037586%，最大PSD差0.003418dB，均通过原1%/.1dB门限。
    FF0：38.838222→38.840097fs，积分变化+0.004827%，最大PSD差0.000776dB，均通过原1%/.1dB门限。
  - VCO尾管候选的新控制电压为0.753032567247V；实测载频残差-0.750716ppm，通过原100ppm门限。在10kHz、100kHz、1MHz、10MHz、100MHz、492MHz六个频偏处，候选相对基准的定时噪声PSD变化分别为-0.438952dB、-1.097701dB、-0.762836dB、-0.411057dB、-0.359738dB、-0.364806dB。条件为TT27/1.2V/Q5πRLC/CF40/静态参考/固定÷4/10fF，仅XV开启噪声；fresh
    PSS、.125ps步长及1023边带。候选MT560µm/2µm、c21，基准为原尾管/c23/控制.679V。载频约3.9348GHz；幅度与电流也改变，因此不能把全部改善归因于面积。六点不是积分结果；旧154ppm及119ppm失配负结果保留。
  - 已启动vcomatcheddense01：候选.25ps、基准.125ps、候选.125ps三个单线程串行任务，各95个频点。与既有基准.25ps密集谱组成两个独立数值精度检查；相同设计和偏置下保持.1dB PSD、1%积分及100ppm载频门限，比较匹配工作点的高频段积分。当前尚无新密集谱结果；不将自由VCO的低频谱当作闭环抖动。
  - 全噪声任务进入PNoise后，先回收已接受PSS的时域与频域波形；源输入、远端及本地文件hash一致，未生成伪造的完成记录。周期、平衡和有效性均通过，输出电流KCL归一化误差11.366615ppm。CP实际控制下降沿比名义脉冲晚144.671ps。整个gate-low窗口的输出净电荷+0.276128fC，关断1ns以后的部分却为+2.222311fC，体现早晚电流相抵。这些是含位移电流的端电流，不直接称为漏电，也不能据此决定噪声贡献。
  - 六只CP器件的BSIM4内部量已经回收，已核对仅观测量改变；逐时电阻性电流、gm、端电压和电荷见对应验证文件。整周期端电流与电阻性电流一致性检查：True。内部量本身不构成噪声PSD。 关断5ns后尾管电阻性电流仅10.85pA，端电流44.28nA；输入对和镜像仍有电阻性电流。region代码全部为0且与偏置管导通矛盾，暂不采信。简单qd导数尚不能闭合所有器件的逐时端口电流差，失败对照保留。
  - 完整14位原/候选计数器：TT27、SS60已通过各30个门控暂停检查，覆盖各级进位边界、回卷和复位。其余角仍未完成；待全批次功能检查通过后才生成独立核心，主PLL未替换。 TT复位初段从级栈节点峰值：原29.503904mV，候选0.203602µV。
    SS复位初段从级栈节点峰值：原29.502679mV，候选0.458661µV。
