    maturity: 3
    note: 'VCO尾管MT由原300um/1um经600um/2um试验回调为560um/2um，CF40、TT27/1.2V/Q5、原coarse23/ctrl.679V、静态参考/固定M4/10fF；独立fresh
      PSS、.5ps/255边带。六个频偏10k/100k/1M/10M/100M/492MHz的时序PSD变化为-0.507/-1.173/-0.837/-0.476/-0.424/-0.435dB；电流变化+0.604%，RF变化-0.486%，振幅变化+3.609%。电流已接近，但工作点匹配检查仍失败；未把六点积分或直接采用。另测控制点0.741169058V，RF相对误差-22.236ppm，100ppm匹配门限通过；六点时序PSD变化-0.565/-1.183/-0.783/-0.416/-0.361/-0.357dB。仍非完整积分或PLL结果。
      首次插值.718011788V的-322.854ppm失败记录保留；第二次实测通过。1MHz尾管闪烁噪声贡献降低6.128410dB。CF40全95点.5ps/255边带与.25ps/511边带完成。最大PSD变化0.087244dB，RF变化0.010203%，高偏移积分RMS最大变化0.088433%；原数值门限总判定未通过，各检查为{''phase_noise'':
      True, ''rf_frequency'': False, ''high_band_rms'': True}。保留原.1dB/1e-4/1%门限；不是整机10kHz起的积分。'
