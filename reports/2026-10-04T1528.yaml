overall:
  phase: VCO器件噪声优化、载频匹配和核心周期诊断
  summary: 尾管候选通过等频率六点噪声对照，1MHz改善约0.78dB；完整频谱扫描已启动。DAC关断状态在实际核心中改善，但闭环PSS及整机抖动尚未验收。
  since_last:
  - VCO尾管MT由原300um/1um经600um/2um试验回调为560um/2um，CF40、TT27/1.2V/Q5、原coarse23/ctrl.679V、静态参考/固定M4/10fF；独立fresh PSS、.5ps/255边带。六个频偏10k/100k/1M/10M/100M/492MHz的时序PSD变化为-0.507/-1.173/-0.837/-0.476/-0.424/-0.435dB；电流变化+0.604%，RF变化-0.486%，振幅变化+3.609%。电流已接近，但工作点匹配检查仍失败；未把六点积分或直接采用。
  - 另测控制点0.741169058V，RF相对误差-22.236ppm，100ppm匹配门限通过；六点时序PSD变化-0.565/-1.183/-0.783/-0.416/-0.361/-0.357dB。仍非完整积分或PLL结果。
    首次插值.718011788V的-322.854ppm失败记录保留；第二次实测通过。1MHz尾管闪烁噪声贡献降低6.128410dB。
  - 加七只DAC放电MOS并延长自身PSS稳定段后，末尾两个250ns窗口保存电压最大周期差由61.417668mV降为1.522184mV；控制电压周期差由2.409564mV降为36.299770uV，所存DAC关断节点峰值14.039047uV。11个时钟分支计数、coarse23及控制范围通过，但1mV密集周期门限仍失败。电路与稳定时长同时改变，不隔离归因。
    数据窗口5.25–5.75us末尾缺0.395ps记录，显式保留缺口且不外推；初始化轨迹不等于Newton解或随机噪声。 15:27所见新核心四轮Newton范数3.69M/495k/2.53M/6.62M，仍未收敛；状态改善尚未解决所观察到的求解发散。迭代试探中的异常电压不作稳态器件应力或噪声结果。
  - 'CF40全95点.5ps/255边带与.25ps/511边带完成。最大PSD变化0.087244dB，RF变化0.010203%，高偏移积分RMS最大变化0.088433%；原数值门限总判定未通过，各检查为{''phase_noise'':
    True, ''rf_frequency'': False, ''high_band_rms'': True}。保留原.1dB/1e-4/1%门限；不是整机10kHz起的积分。'
  - RT4主频带暂定63.257767fs结果已回收；pnnear25点仍由原PID继续，客户端21600s等待已超时，不代表仿真终止。完整RT4+新分频器64us独立复位继续。核心PSS仍按原判据求解，无有效闭环噪声结论。
    等频率尾管候选已接替CF40释放的1线程长槽，运行.25ps/511边带/95频点；没有自动追加另一个精度任务。
